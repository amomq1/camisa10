<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style_dados_cadastrais.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Login</title>
</head>

<body>

  <header>
    <img src="/img/logo_site_camisa_10.png" alt="Logo">
  </header>

    <div class="login">
        <h2>Login</h2>

        <input type="text" id="loginUsuario" placeholder="Usuário">
        
        <div class="campo-senha">
            <input type="password" id="loginSenha" placeholder="Senha">
            <i class="fa-solid fa-eye-slash" id="toggleSenhaLogin"></i>
        </div>

        <button onclick="login()">Entrar</button>

        <p class="cadastro-link">
             Ainda não sou cadastrado?
             <a href="cadastro.html">Criar cadastro</a>
        </p>
    </div>

    <div class="suporte-contato">
        <p class="suporte-titulo">Esqueceu a senha ou está com alguma dificuldade?</p>
        <p class="suporte-texto">
            Entre em contato pelo WhatsApp ou Instagram
        </p>

        <div class="redes-sociais">
            <a href="https://wa.me/+5574999570458" target="_blank" class="social-btn whatsapp">
                <i class="fab fa-whatsapp"></i>
            </a>

            <a href="https://instagram.com/aposte_camisa10" target="_blank" class="social-btn instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="./dados_cadastrais.js"></script>

</body>
</html>
