<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Contato - Camisa10</title>
    <!-- Importando a fonte do site -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_info.css">
</head>
<body>

    <!-- Header contendo a logo oficial centralizada -->
    <header>
        <img src="/img/logo_site_camisa_10.png" alt="Camisa10" class="logo">
    </header>

    <div class="wrapper-voltar">
        <button type="button" class="btn-voltar" onclick="history.back()">&larr; Voltar</button>
    </div>

    <div class="container-pagina">
        <h1>Entre em Contato</h1>

        <p class="text-destaque">Se caso tiver com alguma dificuldade pode pesquisar em:</p>
        
        <!-- Botão de Ajuda -->
        <div class="wrapper-botoes">
            <form action="ajuda_regras.html" method="get">
                <button type="submit" class="btn-ajuda">PÁGINA AJUDA</button>
            </form>
        </div>

        <p class="text-destaque">MAS SE PREFERIR PODE ENTRAR EM CONTATO PELO WHASAPP OU INSTAGRAM</p>

        <!-- Botões de Redes Sociais -->
        <div class="wrapper-botoes">
            <form action="https://wa.me/qr/YUP533G3XOBFO1" method="get">
                <button type="submit" class="btn-whatsapp">Whatsapp</button>
            </form>
            
            <form action="https://www.instagram.com/aposte_camisa10/" method="get">
                <button type="submit" class="btn-instagram">INSTAGRAM</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 Camisa10. Todos os direitos reservados.
    </footer>

</body>
</html>
